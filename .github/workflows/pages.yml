name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: node --test tests/*.test.js

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时自动创建 Pages 站点，省去手动开开关
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
